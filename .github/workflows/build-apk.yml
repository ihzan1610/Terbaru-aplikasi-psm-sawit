
name: Build APK PSM SAWIT

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract PSM SAWIT ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP aplikasi tidak ditemukan"
            exit 1
          fi
          unzip -q "$ZIP" -d project
          test -f project/PSMSAWIT-main/package.json
          echo "APP_DIR=project/PSMSAWIT-main" >> "$GITHUB_ENV"

      - name: Check project scripts
        run: |
          cd "$APP_DIR"
          test -f scripts/patch-android-manifest.js
          test -f scripts/patch-android-rawbt.js
          test -f scripts/patch-android-imagesaver.js
          test -f scripts/patch-android-csvsaver.js
          test -f scripts/patch-android-final-native.js
          test -f scripts/patch-android-psmnative.js
          test -f scripts/patch-android-workmanager.js
          test -f scripts/patch-android-icons.js

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install

      - name: Test enhancements
        run: |
          cd "$APP_DIR"
          npm run test:enhancements

      - name: Prepare web files
        run: |
          cd "$APP_DIR"
          node scripts/copy-html2canvas.js

      - name: Generate Android project
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android

      - name: Patch Android manifest
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-manifest.js

      - name: Patch RAWBT
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-rawbt.js

      - name: Patch ImageSaver
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-imagesaver.js

      - name: Patch CsvSaver
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-csvsaver.js

      - name: Patch final native saver
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-final-native.js

      - name: Patch PSM Native
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-psmnative.js

      - name: Install WorkManager
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-workmanager.js

      - name: Patch Android icons
        run: |
          cd "$APP_DIR"
          node scripts/patch-android-icons.js

      - name: Verify native features
        run: |
          cd "$APP_DIR"
          grep -q 'androidx.work:work-runtime' android/app/build.gradle
          test -f android/app/src/main/java/com/psmsawit/timbangan/PsmCloudSyncWorker.java
          grep -q 'PsmCloudSyncWorker.enqueue' android/app/src/main/java/com/psmsawit/timbangan/PsmNativePlugin.java

      - name: Sync Android after patches
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Verify native plugins
        run: |
          cd "$APP_DIR"
          find android -iname '*ImageSaver*' -type f | grep -q .
          find android -iname '*CsvSaver*' -type f | grep -q .
          find android -iname '*PsmNative*' -type f | grep -q .

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$APP_DIR/android/app/build/outputs/apk/debug/"*.apk output/PSM-SAWIT-debug.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-SAWIT-debug-apk
          path: output/PSM-SAWIT-debug.apk

